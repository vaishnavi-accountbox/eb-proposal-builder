    function renderView(settings) {
        if (!settings) settings = {};
        window.LANDING_PAGE_JSON = settings;
        window.LANDING_PAGE_JSON.bodySettings = settings.template_body_settings ? JSON.parse(settings.template_body_settings) : getDefaultBodySetting();
        window.LANDING_PAGE_JSON.fontFamilies = LANDING_PAGE_JSON.bodySettings.fontFamilies || [];
        if (settings.sections && settings.sections.length > 0) {
            window.LANDING_PAGE_JSON.sections = settings.sections.map(section => {
                try {
                    return JSON.parse(section.builder_json_str.value);
                } catch (e) {
                    return JSON.parse(section.builder_json_str);
                }
            });
        } else {
            window.LANDING_PAGE_JSON.sections = [];
        }

    // Function to fetch KB Settings
    function fetchSettings(token) {
        console.log("token", token);

        if (!token) {
            console.warn("No session token found. Skipping settings fetch.");
            return;
        }

        $.ajax({
            url: "http://localhost:8888" + "/rest/api/panel/v2/proposals",
            method: "GET",
            dataType: "json",
            contentType: "application/json",
            headers: {
                authorization: token
            },
            xhrFields: {
    withCredentials: true   // allow cookies to be sent
  },
  crossDomain: true,
            success: function (response) {
                renderView(response);
            },
            error: function (error) {
                console.error("Error fetching settings:", error);
            }
        });
    }
